<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pokémon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pokémon Cards</h1>
        
        <div class="controls">
            <div class="input-group">
                <label for="cardCount">Number of Cards:</label>
                <input type="number" id="cardCount" min="1" max="20" value="6">
            </div>
            
            <div class="category-buttons">
                <button class="category-btn" data-type="fire">🔥 Fire</button>
                <button class="category-btn" data-type="water">💧 Water</button>
                <button class="category-btn" data-type="grass">🌿 Grass</button>
                <button class="category-btn" data-type="electric">⚡ Electric</button>
                <button class="category-btn" data-type="psychic">🔮 Psychic</button>
                <button class="category-btn" data-type="dragon">🐉 Dragon</button>
                <button class="category-btn" data-type="normal">⚪ Normal</button>
                <button class="category-btn" data-type="poison">☠️ Poison</button>
            </div>
            
            <button id="fetchBtn">Fetch Pokémon</button>
        </div>
        
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Loading Pokémon...</p>
        </div>
        
        <div id="pokemonContainer" class="pokemon-container"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
