<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Problem 5 - VSCode Bottom Bar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #1e1e1e;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 40px;
      padding: 60px 40px;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }

    .left-panel h2 {
      color: #ffffff;
      font-size: 2rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .left-panel p {
      color: #cccccc;
      font-size: 1rem;
      line-height: 1.6;
    }

    .right-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .lang-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px 10px;
      border-radius: 6px;
      transition: background-color 0.2s;
    }

    .lang-item:hover {
      background-color: #2d2d2d;
    }

    .lang-item img {
      width: 36px;
      height: 36px;
    }

    .lang-item span {
      color: #cccccc;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <h2>Code in any language</h2>
      <p>
        Supports virtually every programming language out of the box.
        Syntax highlighting, IntelliSense, linting, debugging, refactoring,
        and more — all built in and ready to go.
      </p>
    </div>
    <div class="right-panel">
      <div class="lang-item">
        <img src="https://code.visualstudio.com/assets/languages/JavaScript.svg" alt="JavaScript">
        <span>JavaScript</span>
      </div>
      <div class="lang-item">
        <img src="https://code.visualstudio.com/assets/languages/TypeScript.svg" alt="TypeScript">
        <span>TypeScript</span>
      </div>
      <div class="lang-item">
        <img src="https://code.visualstudio.com/assets/languages/Python.svg" alt="Python">
        <span>Python</span>
      </div>
      <div class="lang-item">
        <img src="https://code.visualstudio.com/assets/languages/C%23.svg" alt="C#">
        <span>C#</span>
      </div>
      <div class="lang-item">
        <img src="https://code.visualstudio.com/assets/languages/C%2B%2B.svg" alt="C++">
        <span>C++</span>
      </div>
      <div class="lang-item">
        <img src="https://code.visualstudio.com/assets/languages/HTML.svg" alt="HTML">
        <span>HTML</span>
      </div>
      <div class="lang-item">
        <img src="https://code.visualstudio.com/assets/languages/Java.svg" alt="Java">
        <span>Java</span>
      </div>
      <div class="lang-item">
        <img src="https://code.visualstudio.com/assets/languages/JSON.svg" alt="JSON">
        <span>JSON</span>
      </div>
      <div class="lang-item">
        <img src="https://code.visualstudio.com/assets/languages/PHP.svg" alt="PHP">
        <span>PHP</span>
      </div>
      <div class="lang-item">
        <img src="https://code.visualstudio.com/assets/languages/Markdown.svg" alt="Markdown">
        <span>Markdown</span>
      </div>
      <div class="lang-item">
        <img src="https://code.visualstudio.com/assets/languages/Powershell.svg" alt="Powershell">
        <span>Powershell</span>
      </div>
      <div class="lang-item">
        <img src="https://code.visualstudio.com/assets/languages/YAML.svg" alt="YAML">
        <span>YAML</span>
      </div>
    </div>
  </div>
</body>
</html>
