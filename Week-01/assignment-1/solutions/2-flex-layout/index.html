<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Problem 2 - Flex Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      height: 500px;
      display: flex;
      gap: 0;
    }

    .left-panel {
      flex-grow: 1;
      background-color: #e74c3c;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      border-radius: 8px 0 0 8px;
    }

    .right-panel {
      flex-grow: 2;
      background-color: #3498db;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      border-radius: 0 8px 8px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel">Red (1x)</div>
    <div class="right-panel">Blue (2x)</div>
  </div>
</body>
</html>
