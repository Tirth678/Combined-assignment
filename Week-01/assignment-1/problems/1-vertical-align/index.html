
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical Align</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 1200px;
            height: 500px;
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .content {
            text-align: center;
        }
        
        h1 {
            margin: 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="content">
            <h1>Hello World</h1>
        </div>
    </div>
</body>

</html>
